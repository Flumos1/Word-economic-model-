name: Accounting regression
on:
  push:
    paths:
      - 'tests/**'
      - 'src/**'
      - '.github/workflows/accounting-regression.yml'
  pull_request:
    paths:
      - 'tests/**'
      - '.github/workflows/accounting-regression.yml'
  workflow_dispatch:
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Three-sector accounting regression
        run: python tests/test_closed_economy_v01.py
      - name: Four-sector accounting regression
        run: python tests/test_government_economy_v02.py
      - name: Four-sector parameter-grid regression (10,000 cases)
        run: python tests/test_government_parameter_grid_v03.py
      - name: Four-sector net-worth accounts v04
        run: python tests/test_sector_accounts_v04.py
      - name: Periodic SFC sector accounts v05
        run: python tests/test_sfc_accounts_v05.py
      - name: Formal sector accounts v06 (7 tests, 432 scenarios)
        run: python tests/test_accounting_core_v06.py
      - name: Accruals and other changes v07
        run: python tests/test_extended_accounts_v07.py
      - name: Two-country FX and trade prototype
        run: python tests/test_two_country_v01.py
