name: Accounting regression
on:
  push:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'protocols/**'
      - '.github/workflows/accounting-regression.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'src/**'
      - 'protocols/**'
      - '.github/workflows/accounting-regression.yml'
  workflow_dispatch:
jobs:
  accounting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Three-sector accounting regression
        run: python tests/test_closed_economy_v01.py
      - name: Four-sector accounting regression
        run: python tests/test_government_economy_v02.py
      - name: Four-sector parameter-grid regression (10,000 cases)
        run: python tests/test_government_parameter_grid_v03.py
      - name: Four-sector net-worth accounts v04
        run: python tests/test_sector_accounts_v04.py
      - name: Periodic SFC sector accounts v05
        run: python tests/test_sfc_accounts_v05.py
      - name: Formal sector accounts v06 (7 tests, 432 scenarios)
        run: python tests/test_accounting_core_v06.py
      - name: Accruals and other changes v07
        run: python tests/test_extended_accounts_v07.py
      - name: Two-country FX and trade prototype
        run: python tests/test_two_country_v01.py
      - name: Integrated four-sector two-country accounting
        run: python tests/test_integrated_world_v01.py
      - name: Integrated long-run 120 periods and 10,000 cases
        run: python tests/test_integrated_world_longrun.py

      - name: Two-country GDP triple reconciliation (10,000 scenarios)
        run: python tests/test_national_accounts_v01.py
      - name: Posted international trade to GDP bridge (10,000 scenarios)
        run: python tests/test_national_accounts_bridge_v01.py
      - name: Domestic economic journal GDP triple reconciliation (10,000 scenarios)
        run: python tests/test_domestic_journal_v01.py
      - name: Frozen evaluation protocol v1 (hash and structure)
        run: python tests/test_protocol_v1.py
      - name: Draft evaluation protocol v2 (link to v1, M1-M14 coverage)
        run: python tests/test_protocol_v2.py
      - name: Frozen evaluation protocol v3 (hash pin and structure)
        run: python tests/test_protocol_v3.py
      - name: R3 specification (baselines against the frozen protocol, NF-SIM, R2 manifest)
        run: python tests/test_r3_specification.py
      - name: Protocol v4 delta (T3 W1 1996-12, automated retrieval, integrity against v3)
        run: python tests/test_protocol_v4.py
