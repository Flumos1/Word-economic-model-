name: Research regression (waves 21-24, offline)

on:
  push:
    paths:
      - 'tests/**'
      - 'src/amfe/markets/**'
      - 'src/amfe/learning/**'
      - 'data/oil/**'
      - 'protocols/source_registry.json'
      - '.github/workflows/research-regression.yml'
  pull_request:
    paths:
      - 'tests/**'
      - 'src/amfe/markets/**'
      - 'src/amfe/learning/**'
      - 'data/oil/**'
      - 'protocols/source_registry.json'
      - '.github/workflows/research-regression.yml'
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --quiet numpy scipy
      - name: Oil v3 (real EIA monthly series, regime split, demand channel)
        run: python tests/test_oil_v3.py
      - name: Source registry (statuses, honesty, fail-closed, CLI)
        run: python tests/test_source_registry.py
      - name: Market engine and oil module
        run: python tests/test_markets.py
      - name: Oil backtest and PIT calibration
        run: python tests/test_markets_backtest.py && python tests/test_markets_calibration.py
      - name: Agri archetype
        run: python tests/test_markets_agri.py
      - name: Quantity channel (reduced-form, synthetic/blocked-data paths)
        run: python tests/test_quantity_channel.py
      - name: Agri historical validation (synthetic bridge path)
        run: python tests/test_agri_validation.py
