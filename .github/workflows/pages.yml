name: Deploy site (GitHub Pages)

# Deploys the committed static site/ directory (Russian + English) to GitHub Pages.
# The site is a snapshot generated by tools/site_build.py from committed artefacts; this workflow
# rebuilds nothing and never commits, pushes or changes repository content.
#
# One-time setup (owner): repository Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".  GitHub Pages for a PRIVATE repository requires a paid GitHub plan (Pro or
# higher); if the plan does not include Pages, make the repository public or host site/ elsewhere
# (see docs/134).

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Package the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the site snapshot is present
        run: |
          test -f site/index.html
          test -f site/assets/style.css
          test -f site/en/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
