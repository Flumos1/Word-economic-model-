name: Weekly integration report (status bulletin + full regression)

# Stage 9 (integration): a deterministic offline status bulletin of the whole repository
# (data/vintages, frozen protocol and R3 hash chain, candidates, C1-C6, forward registry, risks,
# next steps) plus a summary regression of every tests/test_*.py file. This workflow is additive: the
# existing accounting-regression and data-refresh workflows are unchanged. Nothing is committed: the
# report and the regression JSON are uploaded as a private artifact (they are a snapshot of the run,
# not a frozen document).
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the test dependency (numpy)
        # the model/evaluation-load tests import numpy; without it the regression step would fail on
        # import instead of testing the code
        run: python -m pip install --quiet numpy
      - name: Restore the latest private data artifacts (data/raw is git-ignored)
        # Several tests exercise the local PIT layer and skip without data/raw. The dense vintages
        # come from the newest successful data-refresh artifact; the SPF medians (used by the
        # ensemble smoke test) come from the newest r2-metadata artifact. Raw data stays private:
        # the artifacts are read inside the runner and nothing is committed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p data/raw
          restore() {
            workflow="$1"
            prefix="$2"
            run_id="$(gh run list --workflow="$workflow" --branch=main --status=success \
                       --limit=1 --json databaseId --jq '.[0].databaseId // empty' || true)"
            if [ -z "$run_id" ]; then echo "no successful $workflow artifact found"; return 0; fi
            echo "restoring from $workflow run $run_id"
            if ! gh run download "$run_id" --name "$prefix-$run_id" --dir "tmp-$prefix"; then
              echo "artifact download failed for $workflow run $run_id"; return 0
            fi
            if [ -d "tmp-$prefix/data/raw" ]; then cp -r "tmp-$prefix/data/raw/." data/raw/; fi
          }
          restore data-refresh.yml amfe-data
          restore r2-metadata.yml r2-metadata
          ls data/raw | head -20
          ls data/raw/spf 2>/dev/null || true
      - name: Prepare the build artefacts required by the regression tests
        # these artefacts are git-ignored and are normally produced locally; the clean CI
        # checkout has to rebuild them before the full regression can exercise the tests.
        run: |
          set -u
          mkdir -p build
          python tools/register_modules.py || true
          python tools/product_pack.py || true
      - name: Weekly integration report (deterministic, offline)
        run: |
          mkdir -p build
          python tools/weekly_report.py --date "$(date -u +%F)" --out build/weekly_report.md
      - name: Full regression of every tests/test_*.py (summary JSON)
        run: |
          mkdir -p build
          python tools/regression_report.py \
            --json-out protocols/regression_report.json \
            --markdown-out build/regression_report.md
      - name: Publish the regression summary on the run page
        if: always()
        run: |
          if [ -f build/regression_report.md ]; then cat build/regression_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload the weekly report, the regression summary and its JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amfe-weekly-${{ github.run_id }}
          path: |
            build/
            protocols/regression_report.json
          retention-days: 90
