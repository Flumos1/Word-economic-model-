name: Data refresh (automated retrieval, no human download)

# Protocol v4, owner decisions D-131/D-132: the data pipeline is automated. This workflow runs the
# project retrieval tool against the registered OPEN series - latest files and the vintage files
# listed in protocols/data_plan.json (vintage_date parameter). No FRED API service is used, one
# series per request, rate-limited. Raw third-party files are never committed: they stay in the
# private workflow artifact for this run; the metadata log is uploaded with them.
on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Automated retrieval of registered series (latest and vintages)
        run: python tools/fetch_data.py --out data/raw --log protocols/data_log.json --include-vintages
      - name: R2 data gate check (initial releases against the vintage sets)
        if: always()
        run: python tools/verify_data_gate.py --data data/raw --report protocols/r2_gate_report.json
      - name: Upload raw data, the metadata log and the gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amfe-data-${{ github.run_id }}
          path: |
            data/raw/
            protocols/data_log.json
            protocols/r2_gate_report.json
          retention-days: 90
